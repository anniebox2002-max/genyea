<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客訴歷史查詢系統 — 晉億冷凍機械有限公司</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft JhengHei","PingFang TC",sans-serif; background: #f0f3f8; color: #333; min-height: 100vh; }

    header { background: #1a3a5c; color: #fff; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
    header .logo { font-size: 22px; }
    header h1   { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    header .sub { font-size: 12px; opacity: .6; margin-left: auto; }

    .search-panel { background: #fff; padding: 18px 32px; border-bottom: 1px solid #dde2ea; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sg { display: flex; flex-direction: column; gap: 4px; }
    .sg label { font-size: 11px; font-weight: 700; color: #666; }
    .sg input, .sg select { padding: 8px 11px; border: 1px solid #cdd2da; border-radius: 6px; font-size: 13px; font-family: inherit; background: #fafbfc; outline: none; min-width: 150px; }
    .sg input:focus, .sg select:focus { border-color: #3a7bd5; background: #fff; }
    .sg.wide input { min-width: 260px; }

    .btn { padding: 8px 18px; border: none; border-radius: 6px; font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 700; white-space: nowrap; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-blue   { background: #3a7bd5; color: #fff; }
    .btn-grey   { background: #eef1f6; color: #555; }
    .btn-green  { background: #27ae60; color: #fff; }
    .btn-purple { background: #8e44ad; color: #fff; }
    .btn-red    { background: #c0392b; color: #fff; }

    .stats-bar { background: #fff; padding: 10px 32px; border-bottom: 1px solid #dde2ea; display: flex; gap: 28px; flex-wrap: wrap; }
    .stat { display: flex; flex-direction: column; align-items: center; }
    .stat-n { font-size: 20px; font-weight: 700; color: #1a3a5c; }
    .stat-l { font-size: 11px; color: #999; }
    .stat.red .stat-n { color: #c0392b; }

    .result-area { padding: 20px 32px; }
    .result-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: #666; }
    .result-hdr strong { color: #1a3a5c; font-size: 15px; }
    .tpl-btn { font-size: 12px; color: #3a7bd5; cursor: pointer; text-decoration: underline; background: none; border: none; font-family: inherit; }

    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .card { background: #fff; border: 1px solid #dde2ea; border-radius: 8px; overflow: hidden; cursor: pointer; transition: box-shadow .15s, border-color .15s; }
    .card:hover { box-shadow: 0 3px 14px rgba(58,123,213,.13); border-color: #c5d8f5; }
    .card.open  { border-color: #3a7bd5; }

    .card-head { display: grid; grid-template-columns: 5px 1fr auto; gap: 0 16px; padding: 14px 18px; align-items: start; }
    .cbar { border-radius: 3px; align-self: stretch; min-height: 50px; }
    .bq { background: #e05050; } .bd { background: #e08020; }
    .ba { background: #9b59b6; } .bz { background: #3a7bd5; }
    .bs { background: #27ae60; } .bo { background: #95a5a6; }

    .cinfo { display: flex; flex-direction: column; gap: 5px; }
    .ctop  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .cno   { font-size: 12px; font-weight: 700; color: #1a3a5c; font-family: monospace; letter-spacing: .5px; }
    .ccl   { font-size: 14px; font-weight: 700; color: #1a3a5c; }
    .tag   { font-size: 11px; padding: 2px 9px; border-radius: 12px; font-weight: 700; }
    .st-open    { background: #fff3cd; color: #856404; }
    .st-closed  { background: #d1ecf1; color: #0c5460; }
    .st-pending { background: #f8d7da; color: #721c24; }
    .cpreview { font-size: 13px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 700px; }
    .cright { text-align: right; white-space: nowrap; font-size: 11px; color: #aaa; }
    .cdate  { font-size: 13px; font-weight: 600; color: #777; }

    .card-body { display: none; border-top: 1px solid #e8ecf2; background: #f8f9fc; }
    .card.open .card-body { display: block; }

    .section { padding: 14px 20px; border-bottom: 1px solid #e8ecf2; }
    .section:last-child { border-bottom: none; }
    .section-title { font-size: 11px; font-weight: 700; color: #888; letter-spacing: 1px; margin-bottom: 8px; }
    .section-content { font-size: 13px; color: #333; line-height: 1.8; white-space: pre-wrap; }

    .cm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .cm-card { background: #fff; border: 1px solid #ffe58f; border-radius: 6px; padding: 10px 12px; }
    .cm-label { font-size: 11px; font-weight: 700; color: #8a6d00; margin-bottom: 5px; }
    .cm-val   { font-size: 13px; color: #333; line-height: 1.6; }

    .meta-row { display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; color: #555; }
    .meta-row b { color: #888; }

    .empty { text-align: center; padding: 60px 20px; color: #bbb; }
    .empty .eicon { font-size: 54px; margin-bottom: 14px; }
    .empty p { font-size: 15px; margin-bottom: 20px; }
    .excel-guide { display: inline-block; background: #eaf1fb; border: 1px dashed #3a7bd5; border-radius: 8px; padding: 16px 28px; text-align: left; font-size: 13px; color: #1a5db0; line-height: 2.2; max-width: 520px; }
    .excel-guide b { color: #1a3a5c; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.46); z-index: 200; align-items: center; justify-content: center; }
    .overlay.on { display: flex; }
    .modal { background: #fff; border-radius: 10px; padding: 26px 30px; width: 560px; max-width: 96vw; max-height: 92vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.22); }
    .modal h2 { font-size: 15px; color: #1a3a5c; margin-bottom: 18px; }
    .fg { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .fg label { font-size: 11px; font-weight: 700; color: #666; }
    .req { color: #e05050; }
    .fg input, .fg select, .fg textarea { padding: 8px 10px; border: 1px solid #cdd2da; border-radius: 6px; font-size: 13px; font-family: inherit; background: #fafbfc; outline: none; }
    .fg textarea { resize: vertical; min-height: 72px; }
    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mfoot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

    mark { background: #ffe066; color: inherit; border-radius: 2px; padding: 0 1px; }

    @media (max-width: 640px) {
      header, .search-panel, .result-area, .stats-bar { padding-left: 14px; padding-right: 14px; }
      .card-head { grid-template-columns: 5px 1fr; }
      .cright { display: none; }
      .frow { grid-template-columns: 1fr; }
      .cpreview { max-width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">📋</span>
  <h1>客訴歷史查詢系統</h1>
  <span class="sub">晉億冷凍機械有限公司</span>
</header>

<div class="search-panel">
  <div class="sg wide">
    <label>🔍 關鍵字（編號 / 客戶 / 抱怨內容）</label>
    <input type="text" id="kw" placeholder="輸入關鍵字後按 Enter 或點搜尋…" />
  </div>
  <div class="sg">
    <label>客戶</label>
    <select id="fClient"><option value="">全部</option></select>
  </div>
  <div class="sg">
    <label>處理狀態</label>
    <select id="fSt">
      <option value="">全部</option>
      <option>處理中</option>
      <option>已結案</option>
      <option>待確認</option>
    </select>
  </div>
  <button class="btn btn-blue"   onclick="search()">搜尋</button>
  <button class="btn btn-grey"   onclick="resetSearch()">重設</button>
  <button class="btn btn-green"  onclick="openAdd()">＋ 新增</button>
  <label  class="btn btn-purple">
    📂 匯入 Excel
    <input type="file" id="xlFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="importFile(this)" />
  </label>
  <button class="btn btn-red"    onclick="clearAll()">🗑 清空</button>
</div>

<div class="stats-bar">
  <div class="stat">        <span class="stat-n" id="sTotal">0</span>  <span class="stat-l">總案件</span></div>
  <div class="stat red">    <span class="stat-n" id="sOpen">0</span>   <span class="stat-l">處理中</span></div>
  <div class="stat">        <span class="stat-n" id="sClosed">0</span> <span class="stat-l">已結案</span></div>
  <div class="stat">        <span class="stat-n" id="sPending">0</span><span class="stat-l">待確認</span></div>
</div>

<div class="result-area">
  <div class="result-hdr">
    <span>共 <strong id="rCount">0</strong> 筆</span>
    <button class="tpl-btn" onclick="downloadTemplate()">⬇ 下載 Excel 範本</button>
  </div>
  <div class="card-list" id="cardList"></div>
</div>

<!-- 新增 Modal -->
<div class="overlay" id="addModal" onclick="closeAdd(event)">
  <div class="modal">
    <h2>📝 新增客訴處理單</h2>
    <div class="frow">
      <div class="fg"><label>客戶抱怨處理單編號 <span class="req">*</span></label><input id="a_id" placeholder="如 114112801" /></div>
      <div class="fg"><label>客戶 <span class="req">*</span></label><input id="a_cl" placeholder="如 天合" /></div>
    </div>
    <div class="frow">
      <div class="fg"><label>日期 <span class="req">*</span></label><input id="a_dt" placeholder="114-11-28" /></div>
      <div class="fg"><label>處理狀態 <span class="req">*</span></label>
        <select id="a_st"><option value="">請選擇</option><option>處理中</option><option>已結案</option><option>待確認</option></select>
      </div>
    </div>
    <div class="fg"><label>是否退回品</label><input id="a_ret" placeholder="□是（銷退單號：）　□否" /></div>
    <div class="fg"><label>訂單編號</label><input id="a_ord" placeholder="訂單編號" /></div>
    <div class="fg"><label>抱怨內容 <span class="req">*</span></label><textarea id="a_comp" placeholder="品名、規格、客訴問題描述…"></textarea></div>
    <div class="fg"><label>現況分析</label><textarea id="a_cur" placeholder="外觀、檢測、製程分析結果…"></textarea></div>
    <div class="fg"><label>發生原因</label><textarea id="a_cause" placeholder="根本原因分析…"></textarea></div>
    <div class="fg"><label>對策提出（短期矯正）</label><textarea id="a_s1" placeholder="立即採取的矯正行動…"></textarea></div>
    <div class="fg"><label>對策提出（長期預防）</label><textarea id="a_s2" placeholder="防止再發的改善措施…"></textarea></div>
    <div class="fg"><label>效果確認</label><textarea id="a_s3" placeholder="對策實施後驗證結果…"></textarea></div>
    <div class="frow">
      <div class="fg"><label>預計完成日期</label><input id="a_due" placeholder="114-12-31" /></div>
      <div class="fg"><label>責任單位</label><input id="a_dept" placeholder="品管 / 製造…" /></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-grey" onclick="closeAdd()">取消</button>
      <button class="btn btn-blue" onclick="saveAdd()">✔ 儲存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ================================================================
   真實資料（來源：客戶提供 Excel 檔）
================================================================ */
let data = [
  {
    id: "114112801",
    client: "天合",
    date: "114-11-28",
    status: "處理中",
    hasReturn: "是（銷退單號：1141128001）",
    orderNo: "1111108014",
    complaint: "12\"冷凍馬達 4P/220V/1Φ — 客訴異音",
    current: "",
    cause: "",

    actionLong: "",
    verify: "",
    dueDate: "",
    dept: ""
  },
  {
    id: "114101301",
    client: "天合",
    date: "114-10-13",
    status: "已結案",
    hasReturn: "否",
    orderNo: "1140924003",
    complaint: "10HP室外機 (16\"×3) 6P/220V/1Φ — 客訴銅管內都是油，天合已協助處理，請再注意製程",
    current: "",
    cause: "",
    actionShort: "天合自行處理，業主說用氮氣可以趕出大部分的油",
    actionLong: "請製程再注意品質",
    verify: "",
    dueDate: "",
    dept: ""
  },
  {
    id: "114092601",
    client: "天合",
    date: "114-09-25",
    status: "處理中",
    hasReturn: "是（銷退單號：1140926001）",
    orderNo: "",
    complaint: "8\"蔽極式馬達 4P/220V/1Ψ（冷凍/散熱）吸頂用 — 客訴故障，數量：1顆",
    current: "外觀：外框有變形\n場內檢測運轉時會出現卡卡狀況，建議退回供應商分析異常原因\n供應商：長佑 5M11-08A 風扇馬達組 8\" 鋁葉 220-240V/10W/吸風/31度葉片/鐵框",
    cause: "",
    actionShort: "退回供應商進行根因分析",
    actionLong: "",
    verify: "",
    dueDate: "",
    dept: ""
  },
  {
    id: "114092602",
    client: "天合",
    date: "114-09-25",
    status: "處理中",
    hasReturn: "是（銷退單號：1140926001）",
    orderNo: "",
    complaint: "1HP散熱片 — 客訴沒氣",
    current: "",
    cause: "",
    actionShort: "",
    actionLong: "",
    verify: "",
    dueDate: "",
    dept: ""
  },
  {
    id: "1140721",
    client: "天合",
    date: "114-07-21",
    status: "處理中",
    hasReturn: "否",
    orderNo: "",
    complaint: "60尺吸頂式冷凍 — 客訴除霜能力不佳，業主抱怨電熱不夠熱（600W，240V×2支）\n遇到常開關的冰箱，會卡冰除霜不完全，或需要除霜更久，除霜能力差太多",
    current: "",
    cause: "",
    actionShort: "",
    actionLong: "",
    verify: "",
    dueDate: "",
    dept: ""
  }
];

const ST_MAP = { "處理中":"st-open", "已結案":"st-closed", "待確認":"st-pending" };
const BAR_MAP = { "處理中":"bq", "已結案":"bs", "待確認":"bd" };

function hl(txt, kw) {
  if (!kw || !txt) return txt || "—";
  const e = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return String(txt).replace(new RegExp(e, "gi"), m => `<mark>${m}</mark>`);
}

function render(list, kw) {
  const el = document.getElementById("cardList");
  if (!list.length) {
    el.innerHTML = `
      <div class="empty">
        <div class="eicon">📭</div>
        <p>查無符合條件的記錄</p>
        <div class="excel-guide">
          <b>Excel 欄位順序（第 1 列為標題）：</b><br>
          A 客戶抱怨處理單編號｜B 客戶｜C 日期｜D 處理狀態<br>
          E 是否退回品｜F 訂單編號｜G 抱怨內容<br>
          H 現況分析｜I 發生原因<br>
          J 短期對策｜K 長期對策｜L 效果確認<br>
          M 預計完成日期｜N 責任單位
        </div>
      </div>`;
    return;
  }
  el.innerHTML = list.map(c => {
    const h  = t => hl(t, kw);
    const sm = ST_MAP[c.status] || "st-open";
    const bm = BAR_MAP[c.status] || "bq";
    return `
    <div class="card" id="c-${CSS.escape(c.id)}" onclick="tog('${c.id.replace(/'/g,"\\'")}')">
      <div class="card-head">
        <div class="cbar ${bm}"></div>
        <div class="cinfo">
          <div class="ctop">
            <span class="cno">${h(c.id)}</span>
            <span class="ccl">${h(c.client)}</span>
            <span class="tag ${sm}">${c.status}</span>
            <span style="font-size:11px;color:#aaa;">📅 ${c.date}</span>
          </div>
          <div class="cpreview">${h(c.complaint)}</div>
        </div>
        <div class="cright">
          <div class="cdate">${c.date}</div>
          <div style="margin-top:4px">▼</div>
        </div>
      </div>
      <div class="card-body">
        <div class="section">
          <div class="section-title">🗣 抱怨內容</div>
          <div class="section-content">${h(c.complaint)}</div>
        </div>
        ${c.current ? `
        <div class="section">
          <div class="section-title">🔍 現況分析</div>
          <div class="section-content">${h(c.current)}</div>
        </div>` : ""}
        ${c.cause ? `
        <div class="section">
          <div class="section-title">⚠ 發生原因</div>
          <div class="section-content">${h(c.cause)}</div>
        </div>` : ""}
        <div class="section">
          <div class="section-title">🛠 對策提出</div>
          <div class="cm-grid">
            <div class="cm-card"><div class="cm-label">短期矯正</div><div class="cm-val">${h(c.actionShort)||"—"}</div></div>
            <div class="cm-card"><div class="cm-label">長期預防</div><div class="cm-val">${h(c.actionLong)||"—"}</div></div>
            <div class="cm-card"><div class="cm-label">效果確認</div><div class="cm-val">${h(c.verify)||"—"}</div></div>
          </div>
        </div>
        <div class="section">
          <div class="section-title">ℹ 其他資訊</div>
          <div class="meta-row">
            <span><b>是否退回品：</b>${c.hasReturn||"—"}</span>
            <span><b>訂單編號：</b>${c.orderNo||"—"}</span>
            <span><b>預計完成：</b>${c.dueDate||"—"}</span>
            <span><b>責任單位：</b>${c.dept||"—"}</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
}

function tog(id) {
  const el = document.getElementById("c-" + CSS.escape(id));
  if (el) el.classList.toggle("open");
}

function updateStats(list) {
  document.getElementById("sTotal").textContent   = list.length;
  document.getElementById("sOpen").textContent    = list.filter(c => c.status === "處理中").length;
  document.getElementById("sClosed").textContent  = list.filter(c => c.status === "已結案").length;
  document.getElementById("sPending").textContent = list.filter(c => c.status === "待確認").length;
  document.getElementById("rCount").textContent   = list.length;
}

function rebuildClientFilter() {
  const sel = document.getElementById("fClient");
  const cur = sel.value;
  const clients = [...new Set(data.map(c => c.client))].filter(Boolean).sort();
  sel.innerHTML = `<option value="">全部</option>` +
    clients.map(c => `<option${c === cur ? " selected" : ""}>${c}</option>`).join("");
}

function search() {
  const kw = document.getElementById("kw").value.trim().toLowerCase();
  const cl = document.getElementById("fClient").value;
  const st = document.getElementById("fSt").value;
  const res = data.filter(c => {
    const mKw = !kw || [c.id,c.client,c.complaint,c.current,c.cause,c.actionShort,c.actionLong,c.verify,c.orderNo]
      .join(" ").toLowerCase().includes(kw);
    return mKw && (!cl || c.client === cl) && (!st || c.status === st);
  });
  render(res, kw);
  updateStats(res);
}

function resetSearch() {
  ["kw","fClient","fSt"].forEach(id => { document.getElementById(id).value = ""; });
  search();
}

document.getElementById("kw").addEventListener("keydown", e => { if (e.key === "Enter") search(); });

function clearAll() {
  if (!data.length) return;
  if (!confirm("確定要清空所有資料嗎？")) return;
  data = [];
  rebuildClientFilter();
  search();
}

function makeRecord(row) {
  const g = (...keys) => { for (const k of keys) { const v=(row[k]||"").toString().trim(); if(v) return v; } return ""; };
  return {
    id:          g("客戶抱怨處理單編號","編號","A") || ("ID-"+Date.now()),
    client:      g("客戶","B")         || "未知",
    date:        g("日期","C")         || "—",
    status:      g("處理狀態","狀態","D") || "處理中",
    hasReturn:   g("是否退回品","E")   || "",
    orderNo:     g("訂單編號","F")     || "",
    complaint:   g("抱怨內容","G")     || "",
    current:     g("現況分析","H")     || "",
    cause:       g("發生原因","I")     || "",
    actionShort: g("短期對策","J")     || "",
    actionLong:  g("長期對策","K")     || "",
    verify:      g("效果確認","L")     || "",
    dueDate:     g("預計完成日期","M") || "",
    dept:        g("責任單位","N")     || ""
  };
}

function importFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb   = XLSX.read(e.target.result, { type: "array" });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
      if (!rows.length) { alert("Excel 內沒有資料，請確認格式。"); return; }
      const imported = rows.map(makeRecord);
      data = [...data, ...imported];
      rebuildClientFilter();
      search();
      alert(`✅ 成功匯入 ${imported.length} 筆資料！`);
    } catch (err) { alert("❌ 解析失敗：" + err.message); }
    input.value = "";
  };
  reader.readAsArrayBuffer(file);
}

function downloadTemplate() {
  const headers = [["客戶抱怨處理單編號","客戶","日期","處理狀態","是否退回品","訂單編號","抱怨內容","現況分析","發生原因","短期對策","長期對策","效果確認","預計完成日期","責任單位"]];
  const ws = XLSX.utils.aoa_to_sheet(headers);
  ws["!cols"] = [18,8,12,10,20,14,32,28,28,28,28,20,14,12].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "客訴資料");
  XLSX.writeFile(wb, "客訴處理單範本.xlsx");
}

function openAdd() { document.getElementById("addModal").classList.add("on"); }
function closeAdd(e) { if (!e || e.target.id === "addModal") document.getElementById("addModal").classList.remove("on"); }

function saveAdd() {
  const g = id => document.getElementById(id).value.trim();
  const id=g("a_id"), cl=g("a_cl"), dt=g("a_dt"), st=g("a_st"), comp=g("a_comp");
  if (!id||!cl||!dt||!st||!comp) { alert("請填寫所有標示 * 的必填欄位"); return; }
  if (data.find(c=>c.id===id)) { alert("此編號已存在："+id); return; }
  data.unshift({ id, client:cl, date:dt, status:st,
    hasReturn:g("a_ret"), orderNo:g("a_ord"), complaint:comp,
    current:g("a_cur"), cause:g("a_cause"),
    actionShort:g("a_s1"), actionLong:g("a_s2"), verify:g("a_s3"),
    dueDate:g("a_due"), dept:g("a_dept") });
  rebuildClientFilter();
  search();
  closeAdd();
  ["a_id","a_cl","a_dt","a_st","a_ret","a_ord","a_comp","a_cur","a_cause","a_s1","a_s2","a_s3","a_due","a_dept"].forEach(id=>{ document.getElementById(id).value=""; });
  alert("✅ 已新增："+id);
}

rebuildClientFilter();
search();
</script>
