<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客訴歷史查詢系統 — 晉億冷凍機械有限公司</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #f4f6f9;
      color: #333;
      min-height: 100vh;
    }

    /* ── 頂部標題列 ── */
    header {
      background: #1a3a5c;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header .logo { font-size: 22px; }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
    header .sub { font-size: 12px; opacity: .7; margin-left: auto; }

    /* ── 搜尋區塊 ── */
    .search-panel {
      background: #fff;
      padding: 24px 32px;
      border-bottom: 1px solid #e0e4ea;
    }
    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .search-group { display: flex; flex-direction: column; gap: 6px; }
    .search-group label { font-size: 12px; color: #666; font-weight: 600; }
    .search-group input,
    .search-group select {
      padding: 9px 12px;
      border: 1px solid #cdd2da;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #fafbfc;
      outline: none;
      transition: border-color .2s;
      min-width: 160px;
    }
    .search-group input:focus,
    .search-group select:focus { border-color: #3a7bd5; background: #fff; }
    .search-group.keyword input { min-width: 260px; }

    .btn {
      padding: 9px 22px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 600;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: #3a7bd5; color: #fff; }
    .btn-primary:hover { background: #2f6bbf; }
    .btn-reset { background: #eef1f6; color: #555; }
    .btn-reset:hover { background: #e0e5ef; }
    .btn-upload { background: #27ae60; color: #fff; }
    .btn-upload:hover { background: #1e8449; }

    /* ── 統計列 ── */
    .stats-bar {
      padding: 14px 32px;
      display: flex;
      gap: 24px;
      background: #fff;
      border-bottom: 1px solid #e0e4ea;
      flex-wrap: wrap;
    }
    .stat-item { display: flex; flex-direction: column; align-items: center; }
    .stat-num { font-size: 22px; font-weight: 700; color: #1a3a5c; }
    .stat-label { font-size: 11px; color: #888; margin-top: 2px; }
    .stat-item.highlight .stat-num { color: #d44; }

    /* ── 結果區域 ── */
    .result-area { padding: 24px 32px; }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .result-count { font-size: 14px; color: #555; }
    .result-count strong { color: #1a3a5c; font-size: 16px; }

    /* ── 卡片 ── */
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: #fff;
      border: 1px solid #e0e4ea;
      border-radius: 8px;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0 20px;
      align-items: start;
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s;
    }
    .card:hover { box-shadow: 0 3px 12px rgba(58,123,213,.12); border-color: #b8cbee; }
    .card.expanded { border-color: #3a7bd5; }

    .card-badge {
      width: 4px;
      border-radius: 4px;
      min-height: 56px;
      align-self: stretch;
    }
    .badge-quality    { background: #e05050; }
    .badge-delivery   { background: #e08020; }
    .badge-appearance { background: #9b59b6; }
    .badge-dimension  { background: #3a7bd5; }
    .badge-service    { background: #27ae60; }
    .badge-others     { background: #95a5a6; }

    .card-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card-case-no { font-size: 12px; color: #888; font-family: monospace; }
    .card-client { font-weight: 700; font-size: 15px; color: #1a3a5c; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
    .tag-quality    { background: #fdecea; color: #c0392b; }
    .tag-delivery   { background: #fef0e0; color: #b7610a; }
    .tag-appearance { background: #f5eef8; color: #7d3c98; }
    .tag-dimension  { background: #eaf1fb; color: #1a5db0; }
    .tag-service    { background: #eafaf1; color: #1e8449; }
    .tag-others     { background: #f2f3f4; color: #5d6d7e; }
    .tag-open       { background: #fff3cd; color: #856404; }
    .tag-closed     { background: #d1ecf1; color: #0c5460; }
    .tag-pending    { background: #f8d7da; color: #721c24; }

    .card-title { margin-top: 6px; font-size: 14px; color: #333; line-height: 1.5; }
    .card-meta {
      margin-top: 6px; font-size: 12px; color: #999;
      display: flex; gap: 16px; flex-wrap: wrap;
    }
    .card-meta span { display: flex; align-items: center; gap: 4px; }
    .card-right { text-align: right; font-size: 12px; color: #999; white-space: nowrap; padding-top: 2px; }
    .card-date { font-size: 14px; color: #555; font-weight: 600; }

    /* 展開詳情 */
    .card-detail {
      display: none;
      grid-column: 1 / -1;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed #dde2ea;
      font-size: 13px;
      color: #555;
      line-height: 1.8;
    }
    .card.expanded .card-detail { display: block; }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px 24px;
    }
    .detail-item { display: flex; gap: 8px; }
    .detail-key { color: #888; min-width: 90px; flex-shrink: 0; font-weight: 600; }
    .detail-val { color: #333; }

    /* 對策區塊 */
    .countermeasure-box {
      margin-top: 12px;
      padding: 14px 16px;
      background: #fffbea;
      border: 1px solid #ffe58f;
      border-radius: 6px;
    }
    .countermeasure-box h4 {
      font-size: 13px;
      color: #8a6d00;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cm-item {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .cm-label {
      min-width: 70px;
      color: #8a6d00;
      font-weight: 600;
      flex-shrink: 0;
    }
    .cm-val { color: #333; }

    .detail-full {
      margin-top: 10px;
      padding: 12px;
      background: #f8f9fc;
      border-radius: 6px;
    }
    .detail-full p { margin-bottom: 6px; }

    /* ── 上傳 Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff;
      border-radius: 10px;
      padding: 28px 32px;
      width: 520px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .modal h2 { font-size: 16px; color: #1a3a5c; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #555; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 9px 12px;
      border: 1px solid #cdd2da;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #fafbfc;
      outline: none;
    }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* 空狀態 */
    .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    mark { background: #ffe066; color: inherit; border-radius: 2px; padding: 0 1px; }

    @media (max-width: 600px) {
      header, .search-panel, .result-area { padding-left: 16px; padding-right: 16px; }
      .stats-bar { padding-left: 16px; padding-right: 16px; }
      .card { grid-template-columns: auto 1fr; }
      .card-right { display: none; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">📋</span>
  <h1>客訴歷史查詢系統</h1>
  <span class="sub">晉億冷凍機械有限公司</span>
</header>

<!-- 搜尋區 -->
<div class="search-panel">
  <div class="search-row">
    <div class="search-group keyword">
      <label>關鍵字搜尋（客戶 / 案號 / 問題描述）</label>
      <input type="text" id="keyword" placeholder="例如：天合、外觀不良、尺寸超差…" />
    </div>
    <div class="search-group">
      <label>客戶名稱</label>
      <select id="filterClient">
        <option value="">全部客戶</option>
        <option>天合</option>
        <option>明駿</option>
        <option>玉鼎</option>
      </select>
    </div>
    <div class="search-group">
      <label>問題分類</label>
      <select id="filterCategory">
        <option value="">全部分類</option>
        <option>品質異常</option>
        <option>交期延誤</option>
        <option>外觀不良</option>
        <option>尺寸超差</option>
        <option>服務問題</option>
        <option>其他</option>
      </select>
    </div>
    <div class="search-group">
      <label>處理狀態</label>
      <select id="filterStatus">
        <option value="">全部狀態</option>
        <option>處理中</option>
        <option>已結案</option>
        <option>待確認</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="doSearch()">🔍 搜尋</button>
    <button class="btn btn-reset" onclick="resetSearch()">重設</button>
    <button class="btn btn-upload" onclick="openModal()">＋ 新增客訴</button>
  </div>
</div>

<!-- 統計列 -->
<div class="stats-bar">
  <div class="stat-item">
    <span class="stat-num" id="statTotal">0</span>
    <span class="stat-label">總案件數</span>
  </div>
  <div class="stat-item highlight">
    <span class="stat-num" id="statOpen">0</span>
    <span class="stat-label">處理中</span>
  </div>
  <div class="stat-item">
    <span class="stat-num" id="statClosed">0</span>
    <span class="stat-label">已結案</span>
  </div>
  <div class="stat-item">
    <span class="stat-num" id="statPending">0</span>
    <span class="stat-label">待確認</span>
  </div>
</div>

<!-- 搜尋結果 -->
<div class="result-area">
  <div class="result-header">
    <div class="result-count">共找到 <strong id="resultCount">0</strong> 筆記錄</div>
  </div>
  <div class="card-list" id="cardList"></div>
</div>

<!-- 新增客訴 Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2>📝 新增客訴記錄</h2>
    <div class="form-row">
      <div class="form-group">
        <label>案號 *</label>
        <input type="text" id="f_id" placeholder="如 TH-115090101" />
      </div>
      <div class="form-group">
        <label>客戶名稱 *</label>
        <input type="text" id="f_client" placeholder="如 天合" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>客訴日期 *</label>
        <input type="text" id="f_date" placeholder="115-09-01" />
      </div>
      <div class="form-group">
        <label>問題分類 *</label>
        <select id="f_category">
          <option value="">請選擇</option>
          <option>品質異常</option>
          <option>交期延誤</option>
          <option>外觀不良</option>
          <option>尺寸超差</option>
          <option>服務問題</option>
          <option>其他</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>處理狀態 *</label>
        <select id="f_status">
          <option value="">請選擇</option>
          <option>處理中</option>
          <option>已結案</option>
          <option>待確認</option>
        </select>
      </div>
      <div class="form-group">
        <label>負責部門</label>
        <input type="text" id="f_responsible" placeholder="品保部" />
      </div>
    </div>
    <div class="form-group">
      <label>問題標題 *</label>
      <input type="text" id="f_title" placeholder="簡述客訴問題" />
    </div>
    <div class="form-group">
      <label>客訴來源</label>
      <input type="text" id="f_source" placeholder="如 客戶退貨、Email 通知" />
    </div>
    <div class="form-group">
      <label>根本原因</label>
      <textarea id="f_rootCause" placeholder="分析根本原因（建議使用 5-Why）"></textarea>
    </div>
    <div class="form-group">
      <label>矯正措施（短期）</label>
      <textarea id="f_actionShort" placeholder="立即採取的矯正行動"></textarea>
    </div>
    <div class="form-group">
      <label>預防對策（長期）</label>
      <textarea id="f_actionLong" placeholder="防止再發的系統性對策"></textarea>
    </div>
    <div class="form-group">
      <label>效果確認</label>
      <textarea id="f_verify" placeholder="對策實施後的驗證結果"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>結案日期</label>
        <input type="text" id="f_closeDate" placeholder="尚未結案請填 —" />
      </div>
      <div class="form-group">
        <label>建立人</label>
        <input type="text" id="f_reporter" placeholder="姓名" />
      </div>
    </div>
    <div class="form-group">
      <label>詳細說明</label>
      <textarea id="f_detail" placeholder="完整描述客訴情況、數量、影響範圍等"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-reset" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitForm()">✔ 儲存</button>
    </div>
  </div>
</div>

/* ── 分類對應 ── */
const categoryMap = {
  "品質異常":  { badge: "badge-quality",    tag: "tag-quality"    },
  "交期延誤":  { badge: "badge-delivery",   tag: "tag-delivery"   },
  "外觀不良":  { badge: "badge-appearance", tag: "tag-appearance" },
  "尺寸超差":  { badge: "badge-dimension",  tag: "tag-dimension"  },
  "服務問題":  { badge: "badge-service",    tag: "tag-service"    },
  "其他":      { badge: "badge-others",     tag: "tag-others"     }
};
const statusMap = {
  "處理中": "tag-open",
  "已結案": "tag-closed",
  "待確認": "tag-pending"
};

/* ── 高亮關鍵字 ── */
function highlight(text, kw) {
  if (!kw || !text) return text || "";
  const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return String(text).replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
}

/* ── 渲染卡片 ── */
function renderCards(data, kw) {
  const list = document.getElementById('cardList');
  if (data.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>查無符合條件的客訴記錄</p></div>`;
    return;
  }
  list.innerHTML = data.map(c => {
    const hl = t => highlight(t, kw);
    return `
    <div class="card" id="card-${c.id}" onclick="toggleCard('${c.id}')">
      <div class="card-badge ${c.badgeClass}"></div>
      <div class="card-main">
        <div class="card-top">
          <span class="card-case-no">${hl(c.id)}</span>
          <span class="card-client">${hl(c.client)}</span>
          <span class="tag ${c.tagClass}">${c.category}</span>
          <span class="tag ${c.statusClass}">${c.status}</span>
        </div>
        <div class="card-title">${hl(c.title)}</div>
        <div class="card-meta">
          <span>📅 ${c.date}</span>
          <span>👤 ${c.responsible}</span>
          <span>📌 ${c.source}</span>
        </div>
      </div>
      <div class="card-right">
        <div class="card-date">${c.date}</div>
        <div style="margin-top:4px">▼</div>
      </div>
      <div class="card-detail">
        <div class="detail-grid">
          <div class="detail-item"><span class="detail-key">根本原因</span><span class="detail-val">${hl(c.rootCause)}</span></div>
          <div class="detail-item"><span class="detail-key">結案日期</span><span class="detail-val">${c.closeDate}</span></div>
          <div class="detail-item"><span class="detail-key">建立人</span><span class="detail-val">${c.reporter}</span></div>
        </div>
        <div class="countermeasure-box">
          <h4>🛠 對策提出</h4>
          <div class="cm-item"><span class="cm-label">短期矯正</span><span class="cm-val">${hl(c.actionShort)}</span></div>
          <div class="cm-item"><span class="cm-label">長期預防</span><span class="cm-val">${hl(c.actionLong)}</span></div>
          <div class="cm-item"><span class="cm-label">效果確認</span><span class="cm-val">${hl(c.verify)}</span></div>
        </div>
        <div class="detail-full"><p>${hl(c.detail)}</p></div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id) {
  document.getElementById('card-' + id).classList.toggle('expanded');
}

/* ── 搜尋 ── */
function doSearch() {
  const kw       = document.getElementById('keyword').value.trim().toLowerCase();
  const client   = document.getElementById('filterClient').value;
  const category = document.getElementById('filterCategory').value;
  const status   = document.getElementById('filterStatus').value;

  const result = complaints.filter(c => {
    const matchKw = !kw || [c.id, c.client, c.title, c.rootCause, c.actionShort, c.actionLong, c.verify, c.detail, c.source]
      .join(' ').toLowerCase().includes(kw);
    return matchKw
      && (!client   || c.client   === client)
      && (!category || c.category === category)
      && (!status   || c.status   === status);
  });

  document.getElementById('resultCount').textContent = result.length;
  renderCards(result, kw);
  updateStats(result);
}

function updateStats(data) {
  document.getElementById('statTotal').textContent   = data.length;
  document.getElementById('statOpen').textContent    = data.filter(c => c.status === '處理中').length;
  document.getElementById('statClosed').textContent  = data.filter(c => c.status === '已結案').length;
  document.getElementById('statPending').textContent = data.filter(c => c.status === '待確認').length;
}

function resetSearch() {
  ['keyword','filterClient','filterCategory','filterStatus'].forEach(id => {
    document.getElementById(id).value = '';
  });
  doSearch();
}

document.getElementById('keyword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

/* ── Modal ── */
function openModal() {
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  ['f_id','f_client','f_date','f_category','f_status','f_responsible',
   'f_title','f_source','f_rootCause','f_actionShort','f_actionLong',
   'f_verify','f_closeDate','f_reporter','f_detail'].forEach(id => {
    document.getElementById(id).value = '';
  });
}
function closeModalOutside(e) {
  if (e.target.id === 'modalOverlay') closeModal();
}

function submitForm() {
  const get = id => document.getElementById(id).value.trim();
  const id       = get('f_id');
  const client   = get('f_client');
  const date     = get('f_date');
  const category = get('f_category');
  const status   = get('f_status');
  const title    = get('f_title');

  if (!id || !client || !date || !category || !status || !title) {
    alert('請填寫所有標示 * 的必填欄位');
    return;
  }
  if (complaints.find(c => c.id === id)) {
    alert('案號已存在，請確認案號是否重複');
    return;
  }

  const cm = categoryMap[category] || { badge: 'badge-others', tag: 'tag-others' };
  const newRecord = {
    id, client, date, category,
    badgeClass: cm.badge,
    tagClass:   cm.tag,
    status,
    statusClass: statusMap[status] || 'tag-open',
    title,
    responsible: get('f_responsible') || '—',
    source:      get('f_source')      || '—',
    rootCause:   get('f_rootCause')   || '—',
    actionShort: get('f_actionShort') || '—',
    actionLong:  get('f_actionLong')  || '—',
    verify:      get('f_verify')      || '待確認',
    closeDate:   get('f_closeDate')   || '—',
    reporter:    get('f_reporter')    || '—',
    detail:      get('f_detail')      || '—'
  };

  complaints.unshift(newRecord);
  closeModal();
  doSearch();
  alert(`✅ 案號 ${id} 已新增成功！`);
}

/* ── 初始載入 ── */
doSearch();
