<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客訴歷史查詢系統</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #f4f6f9;
      color: #333;
      min-height: 100vh;
    }

    /* ── 頂部標題列 ── */
    header {
      background: #1a3a5c;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header .logo {
      font-size: 22px;
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    header .sub {
      font-size: 12px;
      opacity: .7;
      margin-left: auto;
    }

    /* ── 搜尋區塊 ── */
    .search-panel {
      background: #fff;
      padding: 24px 32px;
      border-bottom: 1px solid #e0e4ea;
    }
    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .search-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .search-group label {
      font-size: 12px;
      color: #666;
      font-weight: 600;
    }
    .search-group input,
    .search-group select {
      padding: 9px 12px;
      border: 1px solid #cdd2da;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #fafbfc;
      outline: none;
      transition: border-color .2s;
      min-width: 160px;
    }
    .search-group input:focus,
    .search-group select:focus {
      border-color: #3a7bd5;
      background: #fff;
    }
    .search-group.keyword input {
      min-width: 260px;
    }
    .btn {
      padding: 9px 22px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 600;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: #3a7bd5;
      color: #fff;
    }
    .btn-primary:hover { background: #2f6bbf; }
    .btn-reset {
      background: #eef1f6;
      color: #555;
    }
    .btn-reset:hover { background: #e0e5ef; }

    /* ── 統計列 ── */
    .stats-bar {
      padding: 14px 32px;
      display: flex;
      gap: 24px;
      background: #fff;
      border-bottom: 1px solid #e0e4ea;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: #1a3a5c;
    }
    .stat-label {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }
    .stat-item.highlight .stat-num { color: #d44; }

    /* ── 結果區域 ── */
    .result-area {
      padding: 24px 32px;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .result-count {
      font-size: 14px;
      color: #555;
    }
    .result-count strong {
      color: #1a3a5c;
      font-size: 16px;
    }

    /* ── 卡片 ── */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #fff;
      border: 1px solid #e0e4ea;
      border-radius: 8px;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0 20px;
      align-items: start;
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s;
    }
    .card:hover {
      box-shadow: 0 3px 12px rgba(58,123,213,.12);
      border-color: #b8cbee;
    }
    .card.expanded {
      border-color: #3a7bd5;
    }

    /* 左側色條 */
    .card-badge {
      width: 4px;
      border-radius: 4px;
      min-height: 56px;
      align-self: stretch;
    }
    .badge-quality    { background: #e05050; }
    .badge-delivery   { background: #e08020; }
    .badge-appearance { background: #9b59b6; }
    .badge-dimension  { background: #3a7bd5; }
    .badge-service    { background: #27ae60; }
    .badge-others     { background: #95a5a6; }

    .card-main {}
    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card-case-no {
      font-size: 12px;
      color: #888;
      font-family: monospace;
    }
    .card-client {
      font-weight: 700;
      font-size: 15px;
      color: #1a3a5c;
    }
    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .tag-quality    { background: #fdecea; color: #c0392b; }
    .tag-delivery   { background: #fef0e0; color: #b7610a; }
    .tag-appearance { background: #f5eef8; color: #7d3c98; }
    .tag-dimension  { background: #eaf1fb; color: #1a5db0; }
    .tag-service    { background: #eafaf1; color: #1e8449; }
    .tag-others     { background: #f2f3f4; color: #5d6d7e; }
    .tag-open       { background: #fff3cd; color: #856404; }
    .tag-closed     { background: #d1ecf1; color: #0c5460; }
    .tag-pending    { background: #f8d7da; color: #721c24; }

    .card-title {
      margin-top: 6px;
      font-size: 14px;
      color: #333;
      line-height: 1.5;
    }
    .card-meta {
      margin-top: 6px;
      font-size: 12px;
      color: #999;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .card-meta span { display: flex; align-items: center; gap: 4px; }

    .card-right {
      text-align: right;
      font-size: 12px;
      color: #999;
      white-space: nowrap;
      padding-top: 2px;
    }
    .card-date {
      font-size: 14px;
      color: #555;
      font-weight: 600;
    }

    /* 展開詳情 */
    .card-detail {
      display: none;
      grid-column: 1 / -1;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed #dde2ea;
      font-size: 13px;
      color: #555;
      line-height: 1.8;
    }
    .card.expanded .card-detail { display: block; }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px 24px;
    }
    .detail-item { display: flex; gap: 8px; }
    .detail-key {
      color: #888;
      min-width: 80px;
      flex-shrink: 0;
      font-weight: 600;
    }
    .detail-val { color: #333; }
    .detail-full {
      margin-top: 10px;
      padding: 12px;
      background: #f8f9fc;
      border-radius: 6px;
    }
    .detail-full p { margin-bottom: 6px; }

    /* 空狀態 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    /* ── 高亮關鍵字 ── */
    mark {
      background: #ffe066;
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    @media (max-width: 600px) {
      header, .search-panel, .result-area { padding-left: 16px; padding-right: 16px; }
      .stats-bar { padding-left: 16px; padding-right: 16px; }
      .card { grid-template-columns: auto 1fr; }
      .card-right { display: none; }
    }
  </style>
</head>

        <option>處理中</option>
        <option>已結案</option>
        <option>待確認</option>

    </div>
    <button class="btn btn-primary" onclick="doSearch()">🔍 搜尋</button>
    <button class="btn btn-reset" onclick="resetSearch()">重設</button>
  </div>
</div>

<!-- 統計列 -->

</div>

<!-- 搜尋結果 -->

  </div>
  <div class="card-list" id="cardList"></div>
</div>

/* ─── 工具：高亮關鍵字 ─── */
function highlight(text, kw) {
  if (!kw) return text;
  const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
}

/* ─── 渲染卡片 ─── */
function renderCards(data, kw) {
  const list = document.getElementById('cardList');
  if (data.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>查無符合條件的客訴記錄</p></div>`;
    return;
  }
  list.innerHTML = data.map(c => {
    const hl = t => highlight(t, kw);
    return `
    <div class="card" id="card-${c.id}" onclick="toggleCard('${c.id}')">
      <div class="card-badge ${c.badgeClass}"></div>
      <div class="card-main">
        <div class="card-top">
          <span class="card-case-no">${hl(c.id)}</span>
          <span class="card-client">${hl(c.client)}</span>
          <span class="tag ${c.tagClass}">${c.category}</span>
          <span class="tag ${c.statusClass}">${c.status}</span>
        </div>
        <div class="card-title">${hl(c.title)}</div>
        <div class="card-meta">
          <span>📅 客訴日期：${c.date}</span>
          <span>👤 負責部門：${c.responsible}</span>
          <span>📌 來源：${c.source}</span>
        </div>
      </div>
      <div class="card-right">
        <div class="card-date">${c.date}</div>
        <div>▼</div>
      </div>
      <div class="card-detail">
        <div class="detail-grid">
          <div class="detail-item"><span class="detail-key">根本原因</span><span class="detail-val">${hl(c.rootCause)}</span></div>
          <div class="detail-item"><span class="detail-key">矯正措施</span><span class="detail-val">${hl(c.action)}</span></div>
          <div class="detail-item"><span class="detail-key">結案日期</span><span class="detail-val">${c.closeDate}</span></div>
          <div class="detail-item"><span class="detail-key">建立人</span><span class="detail-val">${c.reporter}</span></div>
        </div>
        <div class="detail-full"><p>${hl(c.detail)}</p></div>
      </div>
    </div>`;
  }).join('');
}

/* ─── 展開 / 收合卡片 ─── */
function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('expanded');
}

/* ─── 搜尋邏輯 ─── */
function doSearch() {
  const kw       = document.getElementById('keyword').value.trim().toLowerCase();
  const client   = document.getElementById('filterClient').value;
  const category = document.getElementById('filterCategory').value;
  const status   = document.getElementById('filterStatus').value;

  const result = complaints.filter(c => {
    const matchKw = !kw || [c.id, c.client, c.title, c.rootCause, c.action, c.detail, c.source]
      .join(' ').toLowerCase().includes(kw);
    const matchClient   = !client   || c.client   === client;
    const matchCategory = !category || c.category === category;
    const matchStatus   = !status   || c.status   === status;
    return matchKw && matchClient && matchCategory && matchStatus;
  });

  document.getElementById('resultCount').textContent = result.length;
  renderCards(result, kw);
  updateStats(result);
}

function updateStats(data) {
  document.getElementById('statTotal').textContent   = data.length;
  document.getElementById('statOpen').textContent    = data.filter(c => c.status === '處理中').length;
  document.getElementById('statClosed').textContent  = data.filter(c => c.status === '已結案').length;
  document.getElementById('statPending').textContent = data.filter(c => c.status === '待確認').length;
}

function resetSearch() {
  document.getElementById('keyword').value        = '';
  document.getElementById('filterClient').value   = '';
  document.getElementById('filterCategory').value = '';
  document.getElementById('filterStatus').value   = '';
  doSearch();
}

/* ─── Enter 觸發搜尋 ─── */
document.getElementById('keyword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

/* ─── 初始載入 ─── */
doSearch();
</script>
